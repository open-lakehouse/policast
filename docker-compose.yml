# Local Compose stack for the policast-datafusion + policast-uc stack.
#
# Quick reference:
#   docker compose up -d sidecar                             # resolver
#   docker compose --profile tools run --rm compile          # rebuild Cedar manifest
#   docker compose --profile demo  run --rm datafusion-demo  # end-to-end query
#   docker compose --profile spark run --rm spark-demo       # Spark plugin demo
#   docker compose --profile shell run --rm df-shell         # interactive dev shell
#   docker compose --profile uc-oss up -d unitycatalog       # UC OSS server only
#   docker compose --profile uc-full up -d \
#     rustfs rustfs-init unitycatalog uc-bootstrap sidecar-uc-full
#                                                       # full UC + RustFS flow
#
# See docker/README.md for the full walkthrough and known limitations.

x-build-context: &build-context
  context: .
  dockerfile: docker/Dockerfile

services:
  sidecar:
    build:
      <<: *build-context
      target: sidecar
    image: policast-sidecar:local
    container_name: policast-sidecar
    environment:
      POLICAST_UC_SECRET: ${POLICAST_UC_SECRET:?POLICAST_UC_SECRET must be set (see docker/.env.example)}
    ports:
      - "${POLICAST_UC_PORT:-8765}:8765"
    volumes:
      - ./examples/uc/store:/data/store:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "2", "http://127.0.0.1:8765/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 2s
    restart: unless-stopped
    networks: [policast]

  sidecar-uc-full:
    profiles: ["uc-full"]
    build:
      <<: *build-context
      target: sidecar
    image: policast-sidecar:local
    container_name: policast-sidecar-uc-full
    depends_on:
      uc-bootstrap:
        condition: service_completed_successfully
    command:
      [
        "--listen", "0.0.0.0:8765",
        "--backend", "uc-bootstrap",
        "--uc-endpoint", "http://unitycatalog:8080",
        "--uc-storage-uri-template", "file:///data/uc-full-store/{table}",
        "--uc-refresh-interval-secs", "${POLICAST_UC_REFRESH_SECS:-30}",
        "--signing-secret-env", "POLICAST_UC_SECRET"
      ]
    environment:
      POLICAST_UC_SECRET: ${POLICAST_UC_SECRET:?POLICAST_UC_SECRET must be set (see docker/.env.example)}
    ports:
      - "${POLICAST_UC_FULL_PORT:-8766}:8765"
    volumes:
      - uc-full-store:/data/uc-full-store
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "2", "http://127.0.0.1:8765/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks: [policast]

  datafusion-demo:
    profiles: ["demo"]
    build:
      <<: *build-context
      target: demo
    image: policast-demo:local
    depends_on:
      sidecar:
        condition: service_healthy
    environment:
      POLICAST_UC_ENDPOINT: ${POLICAST_UC_ENDPOINT:-http://sidecar:8765}
      POLICAST_UC_SECRET: ${POLICAST_UC_SECRET:?POLICAST_UC_SECRET must be set}
      # Use `-` (not `:-`) so `FOO=` on the host is passed through as
      # empty rather than being replaced with the default. This lets
      # `just demo-physician` actually unset region.
      POLICAST_PRINCIPAL_ID: ${POLICAST_PRINCIPAL_ID-alice@hospital.com}
      POLICAST_PRINCIPAL_ROLE: ${POLICAST_PRINCIPAL_ROLE-analyst}
      POLICAST_PRINCIPAL_REGION: ${POLICAST_PRINCIPAL_REGION-us-east}
      POLICAST_PRINCIPAL_NAME: ${POLICAST_PRINCIPAL_NAME-}
      POLICAST_TABLE: ${POLICAST_TABLE-hospital.clinical.patients}
      # Short name for the GovernedTable inside DataFusion. The Cedar
      # column-mask policies use the short name in their CEL
      # (`resource.table_name == "patients"`). Unset => derived from the
      # last segment of POLICAST_TABLE.
      POLICAST_GOVERNED_NAME: ${POLICAST_GOVERNED_NAME-}
    networks: [policast]

  # Spark enforcement path. Builds the policast-spark assembly jar with sbt in
  # a throwaway stage, then runs RunSpark on a Scala 2.13 Spark 4.2 runtime.
  # No sidecar: the plugin enforces the file-based compiled manifest directly.
  spark-demo:
    profiles: ["spark"]
    build:
      <<: *build-context
      target: spark-demo
      args:
        SPARK_VERSION: ${SPARK_VERSION:-4.2.0}
        SBT_VERSION: ${SBT_VERSION:-1.12.4}
        MAVEN_PROXY_URL: ${MAVEN_PROXY_URL:-}
        # Assembly jar source (see docker/Dockerfile stage 7c). Default builds
        # from source with sbt so `just spark-demo` works offline of CI. CI sets
        # SPARK_JAR_STAGE=spark-prebuilt (+ stages the jar at
        # POLICAST_SPARK_JAR_PATH) to reuse the `spark` job's artifact instead.
        SPARK_JAR_STAGE: ${SPARK_JAR_STAGE:-spark-build}
        POLICAST_SPARK_JAR_PATH: ${POLICAST_SPARK_JAR_PATH:-docker/prebuilt/policast-spark-assembly.jar}
    image: policast-spark-demo:local
    environment:
      # Defaults point at the pre-expanded manifest + data baked into the image
      # (see the spark-demo stage in docker/Dockerfile). Override to enforce a
      # different already-expanded manifest.
      POLICAST_MANIFEST_PATH: ${POLICAST_MANIFEST_PATH:-/opt/policast/examples/policies/manifest.json}
      POLICAST_DATA_PATH: ${POLICAST_DATA_PATH:-/opt/policast/examples/data/patients.csv}
      POLICAST_SPARK_LOG_LEVEL: ${POLICAST_SPARK_LOG_LEVEL:-WARN}
    networks: [policast]

  compile:
    profiles: ["tools"]
    build:
      <<: *build-context
      target: shell
    image: policast-shell:local
    working_dir: /workspace
    volumes:
      - .:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/workspace/target
    command: ["bash", "scripts/compile-policies.sh"]
    networks: [policast]

  df-shell:
    profiles: ["shell"]
    build:
      <<: *build-context
      target: shell
    image: policast-shell:local
    working_dir: /workspace
    tty: true
    stdin_open: true
    environment:
      POLICAST_UC_ENDPOINT: ${POLICAST_UC_ENDPOINT:-http://sidecar:8765}
      POLICAST_UC_SECRET: ${POLICAST_UC_SECRET:-}
    volumes:
      - .:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/workspace/target
    command: ["/bin/bash"]
    networks: [policast]

  # Governed-query policy playground (profile `playground`). Serves the
  # SPA + POST /api/query on :8088. `--demo-table` seeds a self-contained
  # patients Delta table into the `playground-data` volume and registers
  # it as `hospital.clinical.patients`, so the UI works with no UC.
  # To test against a real catalog instead, drop `--demo-table` and pass
  # `--uc-endpoint` / `--uc-auth` (+ `--uc-storage-option`).
  playground:
    profiles: ["playground"]
    build:
      <<: *build-context
      target: playground
    image: policast-playground:local
    container_name: policast-playground
    command:
      [
        "--listen", "0.0.0.0:8088",
        "--demo-table", "file:///data/playground/patients",
      ]
    ports:
      - "${POLICAST_PLAYGROUND_PORT:-8088}:8088"
    volumes:
      - playground-data:/data/playground
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "2", "http://127.0.0.1:8088/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 8s
    restart: unless-stopped
    networks: [policast]

  # RustFS backing store for the full UC profile — an S3-compatible object store
  # that replaces the former MinIO service. Hosts the `policast-demo` bucket
  # carrying the governance delta tables. S3 API on :9000, web console on :9001
  # (log in with RUSTFS_ACCESS_KEY / RUSTFS_SECRET_KEY). Modeled on the
  # unitycatalog-playground RustFS service, but self-contained: it owns its own
  # `rustfs-data` volume rather than sharing that project's store.
  rustfs:
    profiles: ["uc-full"]
    image: ${RUSTFS_IMAGE:-rustfs/rustfs:latest}
    container_name: policast-rustfs
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
    ports:
      - "${RUSTFS_API_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      # A named volume inherits the image's /data ownership on first init, so no
      # permission helper is needed (unlike a host bind mount).
      - rustfs-data:/data
    restart: unless-stopped
    networks: [policast]

  # One-shot bucket bootstrap for RustFS: waits for the S3 API to answer, then
  # creates the `policast-demo` bucket if it does not already exist. Uses the AWS
  # CLI against RustFS's S3-compatible endpoint. RustFS accepts the root key
  # directly, so no STS/AssumeRole session token is needed here — uc-bootstrap
  # writes governance Delta with those static credentials via delta-rs.
  rustfs-init:
    profiles: ["uc-full"]
    image: amazon/aws-cli:latest
    container_name: policast-rustfs-init
    depends_on:
      rustfs:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
    # Shell variables are escaped as `$$` so docker compose passes a literal `$`
    # to the container instead of interpolating them at config-parse time.
    entrypoint:
      - /bin/sh
      - -ec
      - |
        endpoint="http://rustfs:9000"
        echo "[rustfs-init] waiting for RustFS at $$endpoint ..."
        i=0
        until aws --endpoint-url "$$endpoint" s3api list-buckets >/dev/null 2>&1; do
          i=$$((i + 1))
          [ "$$i" -ge 60 ] && { echo "[rustfs-init] RustFS did not become ready in time" >&2; exit 1; }
          sleep 2
        done
        if aws --endpoint-url "$$endpoint" s3api head-bucket --bucket policast-demo >/dev/null 2>&1; then
          echo "[rustfs-init] bucket s3://policast-demo already exists"
        else
          echo "[rustfs-init] creating bucket s3://policast-demo"
          aws --endpoint-url "$$endpoint" s3api create-bucket --bucket policast-demo >/dev/null
        fi
        aws --endpoint-url "$$endpoint" s3 ls
    restart: "no"
    networks: [policast]

  # Staged UC OSS service (profile uc-oss) and full-flow dependency
  # (profile uc-full).
  unitycatalog:
    profiles: ["uc-oss", "uc-full"]
    image: ${UNITYCATALOG_IMAGE:-newfrontdocker/unitycatalog:v0.4.1}
    container_name: policast-unitycatalog
    ports:
      - "${UNITYCATALOG_PORT:-8081}:8080"
    restart: unless-stopped
    networks: [policast]

  # One-shot bootstrap: validates the DDL inputs and publishes the
  # shipped template manifest + bindings + tags into RustFS-backed
  # governance Delta tables (`policies`, `manifest`, `bindings`,
  # `tags`) via the `policast-uc-seed` binary.
  uc-bootstrap:
    profiles: ["uc-full"]
    build:
      <<: *build-context
      target: shell
    image: policast-shell:local
    container_name: policast-uc-bootstrap
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
      unitycatalog:
        condition: service_started
    working_dir: /workspace
    environment:
      POLICAST_UC_ENDPOINT: http://unitycatalog:8080
      POLICAST_STORE_ROOT: examples/uc/store
      POLICAST_UC_STORAGE_URI_TEMPLATE: file:///workspace/.uc-full-store/{table}
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      S3_REGION: ${S3_REGION:-us-east-1}
    volumes:
      - .:/workspace
      - uc-full-store:/workspace/.uc-full-store
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/workspace/target
    command: ["bash", "docker/bootstrap/uc-full-init.sh"]
    restart: "no"
    networks: [policast]

volumes:
  cargo-registry:
  cargo-target:
  rustfs-data:
  uc-full-store:
  playground-data:

networks:
  policast:
    name: policast
