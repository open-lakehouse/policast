[package]
name = "policast-uc"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Unity Catalog policy store + resolver sidecar for policast-cel"

[lints]
workspace = true

[features]
default      = ["client"]
client       = ["dep:reqwest"]
sidecar      = ["dep:axum", "dep:tower", "dep:tower-http", "dep:clap"]
# `redis` makes the materialized protobuf PolicyStore available
# (binary `PolicyManifest` blobs under the `policast:v2:` keyspace).
# Pulls in the `redis` async client and the `proto` conversions from
# `policast-core` (which owns the prost encode/decode).
redis        = ["dep:redis", "policast-core/redis", "policast-core/proto"]
# `uc-bootstrap` enables the Unity Catalog bootstrap backend. It pulls
# in `deltalake` + `datafusion` so the sidecar can open governance
# Delta tables directly and snapshot them into memory. This is opt-in
# because the dep fan-out is significant (tens of transitive crates);
# the flat-file `FileBackend` remains the default sidecar backend. It
# also enables `client` so the shared `uc_rest` REST client is built.
uc-bootstrap = ["client", "dep:deltalake", "dep:datafusion"]

[dependencies]
policast-core = { path = "../policast-core" }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
lru = { workspace = true }
time = { workspace = true }
parking_lot = { workspace = true }

# Client dependencies (gated by `client` feature)
reqwest = { workspace = true, optional = true }

# Materialized PolicyStore dependency (gated by `redis` feature).
# `redis` pins must match policast-core's redis dep so the workspace
# resolves a single version.
redis = { version = "1.2.1", default-features = false, features = ["tokio-comp", "connection-manager"], optional = true }

# Sidecar dependencies (gated by `sidecar` feature)
axum       = { workspace = true, optional = true }
tower      = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
clap       = { workspace = true, optional = true }

# UC bootstrap backend dependencies (gated by `uc-bootstrap` feature).
# Must stay pinned to the same `deltalake` / `datafusion` versions as
# `policast-datafusion` (centralized in the workspace dependencies):
# deltalake-core's transitive `chrono` pin is exact, so a mismatched
# deltalake anywhere in the workspace (even behind an optional feature)
# makes the lockfile unresolvable.
deltalake  = { workspace = true, optional = true }
datafusion = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
tempfile = { workspace = true }

[[bin]]
name = "policast-uc-sidecar"
path = "src/bin/sidecar.rs"
required-features = ["sidecar"]

[[bin]]
name = "policast-uc-seed"
path = "src/bin/seed.rs"
required-features = ["sidecar", "uc-bootstrap"]
